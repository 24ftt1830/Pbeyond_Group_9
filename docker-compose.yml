version: '3.8'
services:
  # PHP Application
  app:
    build: .
    volumes:
      - .:/var/www
    networks:
      - pbeyond-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pbeyond-network

networks:
  pbeyond-network:
    driver: bridge
